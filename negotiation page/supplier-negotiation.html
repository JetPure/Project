<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Fuel Price Negotiation</title>
    <link rel="stylesheet" href="css/supplier-negotiation.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="logo-wrapper">
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/711964d1d9c4d4823932bce73d99a629d8cbc807?placeholderIfAbsent=true&apiKey=47c59bc2adc44eb7904118d72c793476" alt="Header Image" class="header-image" />
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/023c781f2a86ad865571e754740dd0284146b8ad?placeholderIfAbsent=true&apiKey=47c59bc2adc44eb7904118d72c793476" alt="Logo" class="logo" />
        </div>
        <h1 class="title">Fuel Price Negotiation</h1>
      </header>
      
        

      <main class="main-content">
        <section class="offer-section">
          <div class="offer-header">
            <h2 class="offer-title">Offer#1</h2>
          </div>
          <div class="fuel-type">
            <h3>Fuel Type:</h3>
          </div>
          <div class="price-container">
            <span class="price-label">Offered price:</span>
            <div class="price-value">
              <span class="currency">AED</span>
              <img
                src="https://cdn.builder.io/api/v1/image/assets/TEMP/d88481708d6a08ef2fd137eeb6d52f1c67c392ad?placeholderIfAbsent=true&apiKey=47c59bc2adc44eb7904118d72c793476"
                alt="Price"
                class="price-image"
              />
            </div>
          </div>
          <div class="status-container">
            <span class="status-label">Status:</span>
            <div class="status-select">
              <div class="select-value">Reject</div>
              <div class="select-dropdown">
                <span>status</span>
                <img
                  src="https://cdn.builder.io/api/v1/image/assets/TEMP/07f1d827823cb750f7153d824e7bee6aab7ded24?placeholderIfAbsent=true&apiKey=47c59bc2adc44eb7904118d72c793476"
                  alt="Dropdown"
                  class="dropdown-icon"
                />
              </div>
            </div>
          </div>
          <div class="fuel-type-selector">
            <span>Fuel Type</span>
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/f9d5d76c8a4c65846b9afd3d207fd9ec0fe64cab?placeholderIfAbsent=true&apiKey=47c59bc2adc44eb7904118d72c793476"
              alt="Select"
              class="dropdown-icon"
            />
          </div>
        </section>

        <section class="offer-section">
          <div class="offer-header">
            <h2 class="offer-title">Offer#2</h2>
          </div>
          <div class="fuel-type">
            <h3>Fuel Type:</h3>
          </div>
          <div class="price-container">
            <span class="price-label">Offered price:</span>
            <div class="price-value">
              <span class="currency">AED</span>
              <img
                src="https://cdn.builder.io/api/v1/image/assets/TEMP/df7f426dc50835952e4a1fde790c7e4bfdb1d1a6?placeholderIfAbsent=true&apiKey=47c59bc2adc44eb7904118d72c793476"
                alt="Price"
                class="price-image"
              />
            </div>
          </div>
          <div class="status-container">
            <span class="status-label">Status:</span>
            <div class="status-select">
              <div class="select-value">Reject</div>
              <div class="select-dropdown">
                <span>status</span>
                <img
                  src="https://cdn.builder.io/api/v1/image/assets/TEMP/07f1d827823cb750f7153d824e7bee6aab7ded24?placeholderIfAbsent=true&apiKey=47c59bc2adc44eb7904118d72c793476"
                  alt="Dropdown"
                  class="dropdown-icon"
                />
              </div>
            </div>
          </div>
          <div class="fuel-type-selector">
            <span>Fuel Type</span>
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/f9d5d76c8a4c65846b9afd3d207fd9ec0fe64cab?placeholderIfAbsent=true&apiKey=47c59bc2adc44eb7904118d72c793476"
              alt="Select"
              class="dropdown-icon"
            />
          </div>
        </section>

        <section class="offer-section">
          <div class="offer-header">
            <h2 class="offer-title">Offer#3</h2>
          </div>
          <div class="fuel-type">
            <h3>Fuel Type:</h3>
          </div>
          <div class="price-container">
            <span class="price-label">Offered price:</span>
            <div class="price-value">
              <span class="currency">AED</span>
              <img
                src="https://cdn.builder.io/api/v1/image/assets/TEMP/df7f426dc50835952e4a1fde790c7e4bfdb1d1a6?placeholderIfAbsent=true&apiKey=47c59bc2adc44eb7904118d72c793476"
                alt="Price"
                class="price-image"
              />
            </div>
          </div>
          <div class="status-container">
            <span class="status-label">Status:</span>
            <div class="status-select">
              <div class="select-value">Reject</div>
              <div class="select-dropdown">
                <span>status</span>
                <img
                  src="https://cdn.builder.io/api/v1/image/assets/TEMP/07f1d827823cb750f7153d824e7bee6aab7ded24?placeholderIfAbsent=true&apiKey=47c59bc2adc44eb7904118d72c793476"
                  alt="Dropdown"
                  class="dropdown-icon"
                />
              </div>
            </div>
          </div>
          <div class="fuel-type-selector">
            <span>Fuel Type</span>
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/f9d5d76c8a4c65846b9afd3d207fd9ec0fe64cab?placeholderIfAbsent=true&apiKey=47c59bc2adc44eb7904118d72c793476"
              alt="Select"
              class="dropdown-icon"
            />
          </div>
        </section>

        <button class="checkout-button">Checkout</button>
      </main>
    </div>
  </body>
</html>
