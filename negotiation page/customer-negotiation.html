<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Negotiate Fuel Price</title>
    <link rel="stylesheet" href="customer-negotiation.css" />
  </head>
  <body>
    <main class="container">
      <section class="negotiate-container">
        <header class="header">
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/fa18f212a055babeb0c03cf17055c78f961495a0?placeholderIfAbsent=true&apiKey=47c59bc2adc44eb7904118d72c793476" alt="Logo" class="logo" />
          <div class="brand-container">
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/14ff79285051249659c069f82d5ec65e309b07ab?placeholderIfAbsent=true&apiKey=47c59bc2adc44eb7904118d72c793476" alt="Brand" class="brand" />
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/e8fc0e08f39ab636a7e4ccc16c5b010e64cf92f9?placeholderIfAbsent=true&apiKey=47c59bc2adc44eb7904118d72c793476" alt="Icon" class="brand-icon" />
          </div>
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/88f5f836165274ce6c0e4e37868446ceb677a4e8?placeholderIfAbsent=true&apiKey=47c59bc2adc44eb7904118d72c793476" alt="Additional Icon" class="additional-icon" />
        </header>

        <h1 class="title">Negotiate Fuel Price</h1>

        <form class="negotiate-form">
          <div class="fuel-type-section">
            <label for="fuel-type">Fuel Type:</label>
            <button type="button" class="fuel-type-selector">
              <span>Fuel Type</span>
              <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/f9d5d76c8a4c65846b9afd3d207fd9ec0fe64cab?placeholderIfAbsent=true&apiKey=47c59bc2adc44eb7904118d72c793476" alt="Dropdown arrow" class="dropdown-arrow" />
            </button>
          </div>

          <div class="price-section">
            <label for="price">Offer Price:</label>
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/d67f5e0cba44f288bb41660affdc28d214f30cac?placeholderIfAbsent=true&apiKey=47c59bc2adc44eb7904118d72c793476" alt="Price indicator" class="price-indicator" />
            <span class="currency">AED</span>
          </div>

          <div class="notes-section">
            <label for="notes">Notes (Optional):</label>
            <textarea id="notes" placeholder="type here ........."></textarea>
          </div>

          <div class="action-buttons">
            <button type="submit" class="submit-btn">submit offer</button>
            <button type="button" class="cancel-btn">Cancel</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
