<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update Fuel Stock Page</title>
    <link rel="stylesheet" href="css/restockpage.css" />
  </head>
  <body>
    <main class="update-fuel-stock-page">
      <header class="header">
        <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/ac06ebfbb3bc6728108e6c2b698e5e8348129a05?placeholderIfAbsent=true&apiKey=46188f89aad14a83a8560e13565d4420" alt="Logo" class="logo logo-left" />
        <div class="logo-group">
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/c41b270c87844bcdc48a4b6055f97ad4e3c70d89?placeholderIfAbsent=true&apiKey=46188f89aad14a83a8560e13565d4420" alt="Logo" class="logo logo-center" />
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/07ba7a96e1edd85597947bfebd68f6b94ca05eac?placeholderIfAbsent=true&apiKey=46188f89aad14a83a8560e13565d4420" alt="Logo" class="logo logo-top" />
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/e7414ab95f78dee3565dcb3c424c93eb7e07e232?placeholderIfAbsent=true&apiKey=46188f89aad14a83a8560e13565d4420" alt="Logo" class="logo logo-middle" />
        </div>
        <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/f376d756e9e87797d59ddcefc759825ca7c26ff6?placeholderIfAbsent=true&apiKey=46188f89aad14a83a8560e13565d4420" alt="Logo" class="logo logo-right" />
      </header>

      <h1 class="page-title">Restock Fuel</h1>

      <section class="fuel-section fuel-section-vertical">
        <div class="fuel-info">
          <div class="fuel-name-container">
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/082c7e15a8784e857b7f26e0efe2485991717e95?placeholderIfAbsent=true&apiKey=46188f89aad14a83a8560e13565d4420" alt="SAF icon" class="fuel-icon" />
            <h3 class="fuel-name">SAF <br /><br /><br /></h3>
          </div>
          <div class="input-field">
            <input
              type="text"
              placeholder="Enter Fuel Name"
              class="fuel-input"
            />
          </div>
        </div>
        <div class="button-container">
          <button class="restock-button">Restock</button>
          <div class="indicator"></div>
        </div>
      </section>

      <section class="fuel-section fuel-section-horizontal">
        <div class="fuel-name-container horizontal">
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/082c7e15a8784e857b7f26e0efe2485991717e95?placeholderIfAbsent=true&apiKey=46188f89aad14a83a8560e13565d4420" alt="Jet Fuel icon" class="fuel-icon" />
          <h3 class="fuel-name">Jet Fuel<br /><br /></h3>
        </div>
        <button class="restock-button horizontal">Restock</button>
      </section>

      <div class="input-field horizontal-input">
        <input type="text" placeholder="Enter Fuel Name" class="fuel-input" />
      </div>

      <footer class="footer">
        <button class="back-button">Back to Manage Fuel page</button>
      </footer>
    </main>
  </body>
</html>
