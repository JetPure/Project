                  ></path>

              </div>
            </div>
          </header>
          <main class="rejection-content">
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/d6af275368179c400218a4fdabac6693961035a7?placeholderIfAbsent=true"
              alt="Error Icon"
              class="error-image"
            />
            <h1 class="rejection-title">Rejected</h1>
            <p class="rejection-message">
              The entered license number has been rejected due to one of the
              following:
            </p>
            <div class="rejection-reasons">
              <div>1. Incorrect</div>
              <div>2. Expired</div>
            </div>
            
            <button
              class="try-again-button"
              onclick="window.location.href='supplier-selected.html'"
              style="display: block; visibility: visible"
            >
              Try again
            </button>
          </main>
        </div>
      </div>
      <div class="iphone-button volume-up"></div>
      <div class="iphone-button volume-down"></div>
      <div class="iphone-button power-button"></div>
      <div class="iphone-home-indicator"></div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const tryAgainButton = document.querySelector(".try-again-button");
        tryAgainButton.addEventListener("click", function () {
          window.location.href = "supplier-selected.html";
        });
      });
    </script>
  </body>
</html>
