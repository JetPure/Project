<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPhone 16 Pro - License Number Entry</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/supplier-selected.css" />
  </head>
  <body>
    <div class="iphone-frame">
      <div class="iphone-notch"></div>
      <div class="iphone-screen">
        <div class="license-page">
          <div class="header">
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/023c781f2a86ad865571e754740dd0284146b8ad?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="logo-main" alt="Main Logo" />
            <div class="header-right">
              <div class="logo-container">
                <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/5062206e88bfda24573a5001a9e6604ad58c10b5?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="logo-secondary" alt="Secondary Logo" />
                <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/22aba8e8dce9eee2d34e612dbc11df04c2ba614b?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="logo-tertiary" alt="Tertiary Logo" />
              </div>
              <div class="icon-container">
                <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/6e25329b577366acd518075bd496e15900be1a7a?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="icon-left" alt="Icon Left" />
                <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/f2267aa57a82b5673434b8cb73cb36a0da29199a?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="icon-right" alt="Icon Right" />
              </div>
            </div>
          </div>
          <div class="license-title">Enter your License number</div>
          <div class="license-input-container">
            <input
              type="text"
              id="licenseInput"
              class="license-input"
              placeholder="000-000-000-000"
              maxlength="15"
            />
            <div class="error-message" id="errorMessage"></div>
          </div>
          <div class="divider"></div>
          <button class="submit-button" id="submitButton">
            <div class="button-text">Submit</div>
          </button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
