<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Page</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="iphone-frame">
      <div class="iphone-notch"></div>
      <div class="customer-page">
        <div class="header-container">
          <div class="header-icons">
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/e3331263ee615501ca569fcaa7f213b72176f697?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="logo" alt="Logo" />
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/21ccb17e6e25045acfc7f36478f4fed6c6655554?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="icon-notification" alt="Notification" />
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/2d9a38fa74f71bb4d5f3a793a40ff6ae7e936091?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="icon-message" alt="Message" />
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/63bb14f9a2b2441deb33fe9a995b0a7824f8a84c?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="icon-profile" alt="Profile" />
          </div>
          <div class="search-button">
            <div class="button-content"></div>
          </div>
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/c417689c5b1c30acaddc47ef6d8bdaea9f55078a?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="search-icon" alt="Search" />
        </div>

        <div class="categories-section">
          <div class="categories-title">Categories</div>
          <div class="categories-options">
            <div class="buy-option">
              <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/934e6676db7fbae70cff7f6283d4e360a8357e26?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="buy-icon" alt="Buy Icon" />
              <div class="buy-text">Buy</div>
            </div>
            <div class="negotiate-options">
              <div class="negotiate-option">
                <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/34cbbfc195bc7a7a32150b0823955569e2d02aba?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="negotiate-icon" alt="Negotiate Icon" />
                <div class="negotiate-text">negotiate</div>
              </div>
              <div class="track-option">
                <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/6d1843240fcf45a53d6a16d49779fffb5366b72f?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="track-icon" alt="Track Icon" />
                <div class="track-text">track negotiate status</div>
              </div>
            </div>
          </div>
          <div class="top-picks-title">Top Picks for You</div>
        </div>

        <div class="products-container">
          <div class="products-list">
            <!-- First Product -->
            <div class="product-card">
              <div class="product-info">
                <div class="product-title">Sustainable<br />Fuel</div>
                <div class="product-price">3500 AED<br />per liter</div>
              </div>
              <div class="product-image-container">
                <img
                  src="https://cdn.builder.io/api/v1/image/assets/TEMP/3c9d0aa49d02c9c5cdb0b8f26192177eb48d0272?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87"
                  class="product-image"
                  alt="Sustainable Fuel"
                />
                <div class="product-buy-button">Buy</div>
              </div>
            </div>

            <!-- Second Product -->
            <div class="product-card">
              <div class="product-info">
                <div class="product-title">Premium<br />Fuel</div>
                <div class="product-price">3600 AED<br />per liter</div>
              </div>
              <div class="product-image-container">
                <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/9f59c2f24eeb181abcaded9ca067948b2d0d876c?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="product-image" alt="Premium Fuel" />
                <div class="product-buy-button">Buy</div>
              </div>
            </div>

            <!-- Third Product -->
            <div class="product-card">
              <div class="product-info">
                <div class="product-title">Eco<br />Fuel</div>
                <div class="product-price">3200 AED<br />per liter</div>
              </div>
              <div class="product-image-container">
                <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/3c9d0aa49d02c9c5cdb0b8f26192177eb48d0272?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="product-image" alt="Eco Fuel" />
                <div class="product-buy-button">Buy</div>
              </div>
            </div>

            <!-- Fourth Product -->
            <div class="product-card">
              <div class="product-info">
                <div class="product-title">Regular<br />Fuel</div>
                <div class="product-price">3400 AED<br />per liter</div>
              </div>
              <div class="product-image-container">
                <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/9f59c2f24eeb181abcaded9ca067948b2d0d876c?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="product-image" alt="Regular Fuel" />
                <div class="product-buy-button">Buy</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="iphone-home-button"></div>
    </div>
  </body>
</html>
