<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPhone 16 Pro - Verified License</title>
    <link rel="stylesheet" href="css/verify.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Linden+Hill&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="iphone-container">
      <div class="iphone-frame">
        <!-- iPhone Elements -->
        <div class="iphone-notch"></div>
        <div class="side-button button-power"></div>
        <div class="side-button button-volume-up"></div>
        <div class="side-button button-volume-down"></div>
        <div class="side-button button-action"></div>

        <!-- iPhone Screen Content -->
        <div class="iphone-screen">
          <!-- Verified License Page Content -->
          <div class="verified-license-page">
            <div class="header-icons">
              <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/023c781f2a86ad865571e754740dd0284146b8ad?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="icon-left" alt="Icon" />
              <div class="center-icons">
                <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/5062206e88bfda24573a5001a9e6604ad58c10b5?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="icon-center-main" alt="Icon" />
                <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/0e3abf022dab6ed4350cba7b5b9224cbc4da63c6?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="icon-center-secondary" alt="Icon" />
              </div>
              <div class="right-icons">
                <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/6e25329b577366acd518075bd496e15900be1a7a?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="icon-right-top" alt="Icon" />
                <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/f2267aa57a82b5673434b8cb73cb36a0da29199a?placeholderIfAbsent=true&apiKey=988b1a272cfe46c59d2774c98aa82c87" class="icon-right-bottom" alt="Icon" />
              </div>
            </div>
            <h1 class="verified-title">Verified!</h1>
            <p class="verification-message">
              Your License number<br />
              is Valid and Verified!
            </p>
            <p class="continue-text">To continue</p>
            <button class="login-button">
              <span class="button-text">Log in</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
